<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>World Fate : Fantasy Map Simulator</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="game">
  <canvas id="canvas"></canvas>
  <canvas id="mapOverlay"></canvas>

  <div id="top">
    <div class="logo">World <span>Fate</span></div>
    <button id="newWorld">새 세계</button>
    <button id="addNation">국가 생성</button>
    <button id="pause">Ⅱ</button>
    <button class="speed active" data-speed="1">1x</button>
    <button class="speed" data-speed="5">5x</button>
    <button class="speed" data-speed="20">20x</button>
    <button class="speed" data-speed="100">100x</button>
    <button id="save">저장</button>
    <button id="load">불러오기</button>
    <div class="spacer"></div>
    <div id="year">1년</div>
    <div id="stats">국가 0 · 전쟁 0</div>
  </div>

  <div id="left" class="panel">
    <h3>신의 시야</h3>
    <div class="legend"><div class="dot" style="background:#4b8fca"></div>바다</div>
    <div class="legend"><div class="dot" style="background:#6e9360"></div>평야</div>
    <div class="legend"><div class="dot" style="background:#8a775c"></div>산악</div>

    <h4>지도 모드</h4>
    <div class="actionGrid">
      <button class="layer active" data-layer="political">정치</button>
      <button class="layer" data-layer="population">인구</button>
      <button class="layer" data-layer="army">군대</button>
      <button class="layer" data-layer="gold">골드</button>
      <button class="layer" data-layer="tech">기술력</button>
      <button class="layer" data-layer="religion">종교</button>
    </div>

    <h4>외교 선택</h4>
    <select id="relationTarget">
      <option value="-1">대상 선택</option>
    </select>
    <div class="actionGrid">
      <button id="makeAlliance">동맹 맺기</button>
      <button id="breakAlliance">동맹 해체</button>
      <button id="startWar">전쟁 선포</button>
      <button id="makePeace">평화 조약</button>
    </div>

    <h4>선택한 국가</h4>
    <div id="selectedBox">
      <div class="small">국가를 클릭하세요.</div>
    </div>

    <div id="godPanel" style="display:none">
      <h4>신의 개입</h4>
      <input id="renameInput" placeholder="새 국가 이름">
      <button id="renameBtn" style="width:100%">국가 이름 바꾸기</button>
      <div class="actionGrid" style="margin-top:7px">
        <button id="popUp">인구 +10%</button>
        <button id="popDown">인구 -10%</button>
        <button id="armyUp">군대 +10%</button>
        <button id="armyDown">군대 -10%</button>
        <button id="goldUp">골드 +20%</button>
        <button id="goldDown">골드 -20%</button>
        <button id="techUp">기술 +10</button>
        <button id="techDown">기술 -10</button>
        <button id="plague" style="grid-column:1/3">역병 퍼뜨리기</button>
      </div>
      <h4>국가 운명</h4>
      <div class="actionGrid">
        <button id="forceWar">전쟁 강제</button>
        <button id="forcePeace">평화 강제</button>
        <button id="collapse">국가 붕괴</button>
      </div>
    </div>
  </div>

  <div id="right" class="panel">
    <h3>세계의 역사</h3>
    <div id="worldInfo"></div>
    <h4>최근 사건</h4>
    <div id="logs"></div>
  </div>

  <div id="help">
    드래그: 지도 이동 · 휠/두 손가락: 확대/축소 · 국가 선택 · 선택 후 신의 개입 가능
  </div>

  <div id="modal">
    <div id="modalBox">
      <h3 id="modalTitle">국가 만들기</h3>
      <input id="nationInput" placeholder="국가 이름">
      <select id="nationGrade">
        <option value="부족">부족</option>
        <option value="시국">시국</option>
        <option value="왕국" selected>왕국</option>
        <option value="제국">제국</option>
      </select>
      <select id="nationIdeology">
        <option>왕국</option>
        <option>공화국</option>
        <option>제국</option>
        <option>연방</option>
        <option>부족연맹</option>
        <option>도시국가</option>
      </select>
      <input id="nationSpecies" placeholder="종족 (예: 인간, 엘프, 드워프)">
      <div class="closeRow">
        <button id="cancelModal">취소</button>
        <button id="createNationBtn">생성</button>
      </div>
    </div>
  </div>
</div>

<script src="game.js"></script>
<script src="visual-overlays.js"></script>
</body>
</html>
